<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#06281C">
<title>Heater PPM</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-maskable-512.png">
<style>
  html, body { margin: 0; height: 100%; background: #06281C; overflow: hidden; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; background: #06281C; }
  #splash { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 16px; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; text-align: center; padding: 24px; }
  #splash img { width: 128px; height: 128px; border-radius: 28px; box-shadow: 0 8px 24px rgba(0,0,0,.35); }
  #splash h1 { margin: 0; font-size: 24px; letter-spacing: .5px; }
  #splash .sub { margin: -10px 0 4px; color: #3BEA86; font-weight: 700; font-size: 13px; letter-spacing: 2px; }
  #splash p { margin: 0; color: #CFEEE0; font-size: 15px; max-width: 320px; }
  #splash a { color: #17E88F; font-weight: 600; }
  .hide { display: none !important; }
</style>
</head>
<body>
<div id="splash">
  <img src="icon-512.png" alt="">
  <h1>Heater PPM</h1>
  <div class="sub">BUTLIN'S SKEGNESS</div>
  <p id="msg">Loading…</p>
  <p id="help" class="hide">Taking a while? <a id="direct" href="#" target="_blank" rel="noopener">Open in Chrome instead</a></p>
</div>
<iframe id="app" title="Heater PPM" allow="camera; geolocation; clipboard-read; clipboard-write; fullscreen" class="hide"></iframe>
<script>
  // The live Heater PPM app (Google Apps Script). Change this if the app ever gets a new link.
  var APP_URL = "https://script.google.com/macros/s/AKfycbwUv3ggGiz-HzfZqZmst9tZjtgso6H7NjWkezrmptaS3eDJBl1-XB1HkZYr2c6m4i_wdA/exec";

  var frame = document.getElementById("app"), splash = document.getElementById("splash");
  var msg = document.getElementById("msg"), help = document.getElementById("help");
  document.getElementById("direct").href = APP_URL;

  function start() {
    if (!navigator.onLine) {
      msg.textContent = "No signal right now. The app will load as soon as you're back online.";
      return;
    }
    msg.textContent = "Loading…";
    frame.src = APP_URL + location.search;   // passes ?qr=1 etc. straight through
    setTimeout(function () { help.classList.remove("hide"); }, 12000);
  }
  frame.addEventListener("load", function () {
    if (!frame.src) return;
    frame.classList.remove("hide");
    splash.classList.add("hide");
  });
  window.addEventListener("online", function () { if (!frame.src) start(); });
  start();

  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");
</script>
</body>
</html>
